version: '3.8'

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./backups:/var/www/html/backups
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-business_cms}
      DB_USER: ${DB_USER:-cms}
      DB_PASS: ${DB_PASS:-cms_secret}
      SITE_URL: ${SITE_URL:-}
      APP_DEBUG: ${APP_DEBUG:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-business_cms}
      MYSQL_USER: ${DB_USER:-cms}
      MYSQL_PASSWORD: ${DB_PASS:-cms_secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
