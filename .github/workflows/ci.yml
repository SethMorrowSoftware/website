name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-and-test:
    name: Lint & Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the floor: includes/api.php uses the `never` return type.
        php-version: ['8.1', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql, mbstring, fileinfo, curl, dom
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run test suites
        run: php tests/run.php
