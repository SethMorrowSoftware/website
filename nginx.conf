# Nginx configuration for Business Website CMS
# Usage: Include or copy this into your server block.
#   server {
#       listen 80;
#       server_name example.com;
#       root /var/www/html;
#       include /var/www/html/nginx.conf;
#   }

index index.php;

# Gzip compression
gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Cache static assets
location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf|eot|mp4|webm)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, immutable";
}

# Protect sensitive directories
location ~ ^/(database|includes|backups|cli|plugins/.*/src)/ {
    deny all;
    return 403;
}

# Protect sensitive files
location ~ \.(sqlite|sql|md|log|env|txt)$ {
    deny all;
    return 403;
}

# Protect downloads directory (served via PHP)
location ^~ /uploads/downloads/ {
    deny all;
    return 403;
}

# Allow robots.txt
location = /robots.txt {
    allow all;
    try_files $uri =404;
}

# REST API routes
location ^~ /api/v1/ {
    try_files $uri /api/v1/index.php?$query_string;
}

# Clean URLs for known pages
location ~ ^/(home|about|catalog|contact|order|payment|cart|checkout|order-complete|download|paypal-checkout|search|login|register|account|wishlist|forgot-password|reset-password|order-status|blog-post|gallery)/?$ {
    rewrite ^/(.*)/?$ /index.php?page=$1 last;
}

# Product detail pages: /product/slug
location ~ ^/product/([a-zA-Z0-9_-]+)/?$ {
    rewrite ^/product/(.+)/?$ /index.php?page=product&slug=$1 last;
}

# Vendor storefront pages: /vendor/slug
location ~ ^/vendor/([a-zA-Z0-9_-]+)/?$ {
    rewrite ^/vendor/(.+)/?$ /index.php?page=vendor&slug=$1 last;
}

# Blog clean URLs
location ~ ^/blog/?$ {
    rewrite ^/blog/?$ /index.php?page=blog last;
}
location ~ ^/blog/category/([a-zA-Z0-9_-]+)/?$ {
    rewrite ^/blog/category/(.+)/?$ /index.php?page=blog&category=$1 last;
}
location ~ ^/blog/tag/([a-zA-Z0-9_-]+)/?$ {
    rewrite ^/blog/tag/(.+)/?$ /index.php?page=blog&tag=$1 last;
}
location ~ ^/blog/([a-zA-Z0-9_-]+)/?$ {
    rewrite ^/blog/(.+)/?$ /index.php?page=blog-post&slug=$1 last;
}

# PHP handler
location ~ \.php$ {
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_read_timeout 120;
}

# Custom pages: /my-page -> index.php?page=my-page (catch-all for DB-driven pages)
location ~ ^/([a-zA-Z0-9_-]+)/?$ {
    try_files $uri /index.php?page=$1&$query_string;
}

# Fallback — try file, then directory, then 404
location / {
    try_files $uri $uri/ =404;
}
